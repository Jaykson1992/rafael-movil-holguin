name: Generar APK Rafael Movil
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RAFAEL_API_URL: https://rafael-movil-api-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - name: Verificar integridad FINAL build 83
        run: python3 tool/preflight.py
      - name: Probar servidor (flujo completo)
        working-directory: server
        run: |
          npm install --no-audit --no-fund
          npm run smoke
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generar estructura Android si falta
        run: |
          if [ ! -d android ]; then flutter create --platforms=android --org com.rafaelmovil .; fi
          rm -f test/widget_test.dart
      - name: Habilitar permisos GPS Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          perms='''    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.INTERNET" />\n'''
          if 'ACCESS_FINE_LOCATION' not in s:
              s=s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'+perms)
          p.write_text(s)
          PY
      - name: Dependencias
        run: flutter pub get
      - name: Generar icono Android Rafael Movil
        run: |
          # Mantener exactamente el logo aprobado configurado en pubspec.yaml.
          # No sustituirlo por rafael_icon.svg durante la compilación.
          sed -i 's|android:label="rafael_movil_holguin"|android:label="Rafael Móvil Holguín"|g' android/app/src/main/AndroidManifest.xml
          dart run flutter_launcher_icons
      - name: Analizar
        id: flutter_analyze
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tee flutter-analyze.txt
      - name: Guardar diagnostico Flutter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-log
          path: flutter-analyze.txt
          if-no-files-found: error
      - name: Confirmar analisis
        if: steps.flutter_analyze.outcome == 'failure'
        run: exit 1
      - name: Pruebas Flutter
        run: flutter test test/app_state_test.dart
      - name: Verificar servidor de producción
        run: |
          if [ -z "$RAFAEL_API_URL" ]; then
            echo "ERROR: configura RAFAEL_API_URL antes de generar el APK para distribución."
            exit 1
          fi
          case "$RAFAEL_API_URL" in
            https://*) ;;
            *) echo "ERROR: el APK de distribución exige una URL HTTPS."; exit 1 ;;
          esac
          BASE="${RAFAEL_API_URL%/}"
          curl --fail --silent --show-error --max-time 20 "$BASE/health" >/dev/null || { echo "ERROR: /health no responde."; exit 1; }
          curl --fail --silent --show-error --max-time 20 "$BASE/ready" >/dev/null || { echo "ERROR: /ready no confirma almacenamiento listo."; exit 1; }
      - name: Compilar APK release
        run: flutter build apk --release --dart-define=RAFAEL_API_URL="$RAFAEL_API_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: rafael-movil-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publicar APK final para descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Rafael-Movil-Holguin-FINAL-v12.apk
          gh release delete final-v12 --yes --cleanup-tag || true
          gh release create final-v12 Rafael-Movil-Holguin-FINAL-v12.apk --title "Rafael Móvil Holguín FINAL v11" --notes "APK final conectado al backend HTTPS de producción."
