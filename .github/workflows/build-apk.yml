name: Generar APK Rafael Movil

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verificar proyecto
        run: python3 tool/preflight.py

      - name: Probar servidor
        working-directory: server
        run: |
          npm install --no-audit --no-fund
          npm run smoke

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear soporte Android
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.rafaelmovil .
          fi

      - name: Instalar dependencias Flutter
        run: flutter pub get

      - name: Analizar codigo
        run: flutter analyze

      - name: Ejecutar pruebas Flutter
        run: flutter test

      - name: Configurar permisos Android
        run: |
          python3 -c "from pathlib import Path; p=Path('android/app/src/main/AndroidManifest.xml'); s=p.read_text(); marker='<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">'; perms='\\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />\\n    <uses-permission android:name=\"android.permission.INTERNET\" />'; p.write_text(s if 'ACCESS_FINE_LOCATION' in s else s.replace(marker, marker+perms))"

      - name: Verificar API de produccion
        env:
          RAFAEL_API_URL: ${{ vars.RAFAEL_API_URL }}
        run: |
          test -n "$RAFAEL_API_URL" || { echo "Falta configurar RAFAEL_API_URL"; exit 1; }
          case "$RAFAEL_API_URL" in
            https://*) ;;
            *) echo "RAFAEL_API_URL debe usar HTTPS"; exit 1 ;;
          esac
          BASE="${RAFAEL_API_URL%/}"
          curl --fail --silent --show-error --max-time 20 "$BASE/health" >/dev/null
          curl --fail --silent --show-error --max-time 20 "$BASE/ready" >/dev/null

      - name: Compilar APK
        env:
          RAFAEL_API_URL: ${{ vars.RAFAEL_API_URL }}
        run: flutter build apk --release --dart-define=RAFAEL_API_URL="$RAFAEL_API_URL"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: rafael-movil-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
