name: rafael_movil_holguin
description: Rafael Móvil - Transporte Holguín
publish_to: "none"
version: 1.0.0+83

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^13.0.2
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/rafael_logo.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/rafael_logo.jpg"
